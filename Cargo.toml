[workspace]
members = [
  "crates/observer-domain",
  "crates/observer-core",
  "crates/observer-adapters",
  "crates/observer-cli",
  "crates/observer-upload",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ontigon/second-observer"

[workspace.dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.0", features = ["derive"] }
hex = "0.4.3"
rand = "0.10.0"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "rustls", "http2"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.26.0"
thiserror = "2.0.18"
url = { version = "2.5.8", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
